<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Booking API</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 20px auto; padding: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; }
        input, select { padding: 8px; margin: 5px; width: 200px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Test Booking Management API</h1>
    
    <div class="section">
        <h2>1. Đăng nhập (Login)</h2>
        <input type="email" id="loginEmail" placeholder="Email" value="admin@example.com">
        <input type="password" id="loginPassword" placeholder="Password" value="password">
        <button onclick="login()">Đăng nhập</button>
        <div id="loginResult"></div>
    </div>

    <div class="section">
        <h2>2. Lấy danh sách Booking</h2>
        <button onclick="getBookings()">Lấy tất cả Booking</button>
        <div id="bookingsResult"></div>
    </div>

    <div class="section">
        <h2>3. Xem chi tiết Booking</h2>
        <input type="number" id="bookingId" placeholder="Booking ID" value="1">
        <button onclick="getBookingDetail()">Xem chi tiết</button>
        <div id="bookingDetailResult"></div>
    </div>

    <div class="section">
        <h2>4. Tạo Booking mới</h2>
        <input type="number" id="customerId" placeholder="Customer ID" value="1">
        <input type="number" id="tourId" placeholder="Tour ID" value="1">
        <input type="number" id="scheduleId" placeholder="Schedule ID" value="1">
        <input type="number" id="numPeople" placeholder="Số người" value="2">
        <input type="text" id="note" placeholder="Ghi chú">
        <button onclick="createBooking()">Tạo Booking</button>
        <div id="createResult"></div>
    </div>

    <div class="section">
        <h2>5. Cập nhật Booking</h2>
        <input type="number" id="updateBookingId" placeholder="Booking ID" value="1">
        <select id="updateStatus">
            <option value="upcoming">Upcoming</option>
            <option value="ongoing">Ongoing</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
        </select>
        <select id="updatePaymentStatus">
            <option value="unpaid">Unpaid</option>
            <option value="deposit">Deposit</option>
            <option value="paid">Paid</option>
        </select>
        <button onclick="updateBooking()">Cập nhật</button>
        <div id="updateResult"></div>
    </div>

    <div class="section">
        <h2>6. Xóa Booking</h2>
        <input type="number" id="deleteBookingId" placeholder="Booking ID">
        <button onclick="deleteBooking()">Xóa Booking</button>
        <div id="deleteResult"></div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8000/api';
        let token = '';

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    token = data.token;
                    document.getElementById('loginResult').innerHTML = 
                        `<p class="success">✓ Đăng nhập thành công!</p><pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    document.getElementById('loginResult').innerHTML = 
                        `<p class="error">✗ Lỗi: ${data.message}</p>`;
                }
            } catch (error) {
                document.getElementById('loginResult').innerHTML = 
                    `<p class="error">✗ Lỗi: ${error.message}</p>`;
            }
        }

        async function getBookings() {
            if (!token) {
                alert('Vui lòng đăng nhập trước!');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/booking`, {
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('bookingsResult').innerHTML = 
                        `<p class="success">✓ Lấy danh sách thành công! (${data.length} booking)</p><pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    document.getElementById('bookingsResult').innerHTML = 
                        `<p class="error">✗ Lỗi: ${data.message}</p>`;
                }
            } catch (error) {
                document.getElementById('bookingsResult').innerHTML = 
                    `<p class="error">✗ Lỗi: ${error.message}</p>`;
            }
        }

        async function getBookingDetail() {
            if (!token) {
                alert('Vui lòng đăng nhập trước!');
                return;
            }
            
            const id = document.getElementById('bookingId').value;
            
            try {
                const response = await fetch(`${API_URL}/booking/${id}`, {
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('bookingDetailResult').innerHTML = 
                        `<p class="success">✓ Lấy chi tiết thành công!</p><pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    document.getElementById('bookingDetailResult').innerHTML = 
                        `<p class="error">✗ Lỗi: ${data.message}</p>`;
                }
            } catch (error) {
                document.getElementById('bookingDetailResult').innerHTML = 
                    `<p class="error">✗ Lỗi: ${error.message}</p>`;
            }
        }

        async function createBooking() {
            if (!token) {
                alert('Vui lòng đăng nhập trước!');
                return;
            }
            
            const bookingData = {
                customer_id: parseInt(document.getElementById('customerId').value),
                tour_id: parseInt(document.getElementById('tourId').value),
                schedule_id: parseInt(document.getElementById('scheduleId').value),
                num_people: parseInt(document.getElementById('numPeople').value),
                note: document.getElementById('note').value
            };
            
            try {
                const response = await fetch(`${API_URL}/booking`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(bookingData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('createResult').innerHTML = 
                        `<p class="success">✓ Tạo booking thành công!</p><pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    document.getElementById('createResult').innerHTML = 
                        `<p class="error">✗ Lỗi: ${JSON.stringify(data, null, 2)}</p>`;
                }
            } catch (error) {
                document.getElementById('createResult').innerHTML = 
                    `<p class="error">✗ Lỗi: ${error.message}</p>`;
            }
        }

        async function updateBooking() {
            if (!token) {
                alert('Vui lòng đăng nhập trước!');
                return;
            }
            
            const id = document.getElementById('updateBookingId').value;
            const updateData = {
                status: document.getElementById('updateStatus').value,
                payment_status: document.getElementById('updatePaymentStatus').value
            };
            
            try {
                const response = await fetch(`${API_URL}/booking/${id}`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(updateData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('updateResult').innerHTML = 
                        `<p class="success">✓ Cập nhật thành công!</p><pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    document.getElementById('updateResult').innerHTML = 
                        `<p class="error">✗ Lỗi: ${data.message}</p>`;
                }
            } catch (error) {
                document.getElementById('updateResult').innerHTML = 
                    `<p class="error">✗ Lỗi: ${error.message}</p>`;
            }
        }

        async function deleteBooking() {
            if (!token) {
                alert('Vui lòng đăng nhập trước!');
                return;
            }
            
            const id = document.getElementById('deleteBookingId').value;
            
            if (!confirm('Bạn có chắc muốn xóa booking này?')) return;
            
            try {
                const response = await fetch(`${API_URL}/booking/${id}`, {
                    method: 'DELETE',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('deleteResult').innerHTML = 
                        `<p class="success">✓ Xóa thành công!</p><pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    document.getElementById('deleteResult').innerHTML = 
                        `<p class="error">✗ Lỗi: ${data.message}</p>`;
                }
            } catch (error) {
                document.getElementById('deleteResult').innerHTML = 
                    `<p class="error">✗ Lỗi: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
